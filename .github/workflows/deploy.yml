name: Build and Publish Deploy Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://voxdigitalagency.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone output)
        run: npm run build

      - name: Assemble deploy payload
        run: |
          rm -rf payload
          mkdir -p payload/.next
          cp -r .next/standalone/. payload/
          cp -r .next/static payload/.next/static
          cp -r public payload/public
          sed -i "s/const hostname = process.env.HOSTNAME || '0.0.0.0'/const hostname = '0.0.0.0'/" payload/server.js
          grep -c "const hostname = '0.0.0.0'" payload/server.js

      - name: Commit to deploy branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf deploy_branch
          mkdir -p deploy_branch
          cd deploy_branch
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/Muhammad-Arham-6886/digiflix.git"
          if git fetch -q origin deploy 2>/dev/null; then
            git checkout -q -B deploy origin/deploy
            git rm -rfq . || true
          else
            git checkout -q --orphan deploy
          fi
          cp -r ../payload/. .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git -c core.autocrlf=false add -A
          git -c core.autocrlf=false commit -q -m "Deploy build $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q origin deploy
          echo "deploy branch updated"
